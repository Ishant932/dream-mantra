<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dream Mantra — Career Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <p class="hdr-lbl">Dream Mantra</p>
    <h1>Career Library</h1>
    <p class="hdr-sub">Every degree, stream, subject and exam — 1,211+ pathways mapped from Class 10</p>
    <div class="stats" id="hdr-stats"></div>
  </div>
</header>

<!-- TABS -->
<div class="tabs-wrap">
  <div class="tabs" id="tabs"></div>
</div>

<!-- PAGE -->
<div class="page">
  <div class="ctrl-row" id="ctrl-row">
    <input class="srch" id="srch" type="text" placeholder="Search…"/>
    <select class="srt" id="srt">
      <option value="rel">Sort: Relevance</option>
      <option value="ai">Most AI-resilient</option>
      <option value="demand">Highest demand</option>
      <option value="az">A – Z</option>
    </select>
    <button class="mob-btn" id="mob-btn" onclick="openDrw()">Filters</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="body-row">
    <aside class="side" id="side">
      <div class="f-head">
        <span class="f-title">Filters</span>
        <button class="clear-btn" onclick="clearAll()">Clear all</button>
      </div>
      <div id="side-filters"></div>
    </aside>
    <div class="res-area">
      <div class="res-ct" id="res-ct"></div>
      <div id="main-content"></div>
      <div class="load-wrap" id="load-wrap" style="display:none">
        <button class="load-btn" id="load-btn" onclick="loadMore()">Show more</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="m-hdr">
      <div class="m-top">
        <div style="flex:1;padding-right:10px">
          <div class="m-cl" id="mcl"></div>
          <div class="m-name" id="mnm"></div>
          <div class="m-meta" id="mmt"></div>
        </div>
        <button class="m-close" onclick="closeModal()">&#x2715;</button>
      </div>
      <div class="m-badges" id="mbdg"></div>
    </div>
    <div class="m-body">
      <p class="m-desc" id="mdsc"></p>
      <div id="mmtr"></div>
      <dl id="mdl"></dl>
      <p class="m-note">Salaries, demand and personality mappings are indicative field-level guidance. Verify fees, eligibility and exam details on official sources before making decisions.</p>
    </div>
  </div>
</div>

<!-- Drawer -->
<div class="drw-ov" id="drw-ov" onclick="closeDrw()">
  <div class="drw" onclick="event.stopPropagation()">
    <div class="drw-hd">
      <span class="drw-tit">Filters</span>
      <button class="drw-x" onclick="closeDrw()">&#x2715;</button>
    </div>
    <div id="drw-filters"></div>
    <button class="drw-apply" id="drw-apply" onclick="closeDrw()">Show results</button>
  </div>
</div>

  <!-- DATA FILES (load first) -->
  <script src="data/careers-data.js"></script>
  <script src="data/exams-data.js"></script>
  <script src="data/clusters-data.js"></script>
  <script src="data/meta-data.js"></script>

  <!-- APP LOGIC -->
  <script src="js/app.js"></script>
  <script src="js/exams.js"></script>
  <script src="js/clusters.js"></script>

</body>
</html>
