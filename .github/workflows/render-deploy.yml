# Triggers a Render redeploy on every push to main.
# One-time setup: Render Dashboard → dream-mantra → Settings → Deploy Hook → copy URL
# GitHub repo → Settings → Secrets → Actions → New secret: RENDER_DEPLOY_HOOK

name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set — Render will NOT auto-deploy."
            echo "Fix: Render Dashboard → dream-mantra → Settings → Deploy Hook → add URL as GitHub secret RENDER_DEPLOY_HOOK"
            echo "Or: Manual Deploy → Deploy latest commit → Clear build cache"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Render deploy triggered."
