<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Library — Dream Mantra</title>
  <meta name="description" content="Explore 1,200+ career pathways, entrance exams, and education routes — powered by Dream Mantra."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

<!-- ══ HEADER ════════════════════════════════════════════════════════════════ -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-eyebrow">Dream Mantra · Career Guidance</div>
    <h1 class="header-title">Career Library</h1>
    <p class="header-sub">Explore 1,200+ careers — degrees, entrance exams, salaries, and education paths</p>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" autocomplete="off" spellcheck="false"
        placeholder="Search careers — e.g. Full Stack Developer, Doctor, CA…" aria-label="Search careers"/>
      <button class="search-clear" id="search-clear" aria-label="Clear search">✕</button>
    </div>
  </div>
</header>

<!-- Stats strip -->
<div class="stats-strip">
  <div class="stats-inner" id="stats-strip"></div>
</div>

<!-- ══ QUICK CATEGORY CHIPS ══════════════════════════════════════════════════ -->
<div class="cat-strip">
  <div class="cat-strip-inner">
    <span class="cat-strip-label">Browse by</span>
    <div class="cat-chips">
      <button class="cat-chip" data-cat="tech">💻 Technology</button>
      <button class="cat-chip" data-cat="health">🏥 Healthcare</button>
      <button class="cat-chip" data-cat="biz">💼 Business</button>
      <button class="cat-chip" data-cat="creative">🎨 Creative</button>
      <button class="cat-chip" data-cat="science">🔬 Science</button>
      <button class="cat-chip" data-cat="govt">⚖️ Govt / Law</button>
    </div>
  </div>
</div>

<!-- ══ FILTER BAR ═════════════════════════════════════════════════════════════ -->
<div class="filter-bar">
  <div class="filter-inner">
    <span class="f-label">Filters</span>
    <select class="f-select" id="f-stream" aria-label="Filter by stream">
      <option value="">All Streams</option>
    </select>
    <select class="f-select" id="f-cluster" aria-label="Filter by field">
      <option value="">All Fields</option>
    </select>
    <select class="f-select" id="f-level" aria-label="Filter by education level">
      <option value="">Any Level</option>
    </select>
    <select class="f-select" id="f-type" aria-label="Filter by qualification type">
      <option value="">Any Type</option>
    </select>
    <select class="f-select" id="f-demand" aria-label="Filter by industry demand">
      <option value="">Any Demand</option>
      <option value="Very High">Very High</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <div class="filter-divider"></div>
    <button class="clear-all" id="clear-all">Clear filters</button>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;">
      <span class="sort-lbl" style="font-size:12px;color:#8A7F74;">Sort</span>
      <select class="sort-sel" id="sort-sel" aria-label="Sort careers">
        <option value="rel">Relevance</option>
        <option value="demand">Demand</option>
        <option value="az">A–Z</option>
        <option value="salary">Salary</option>
      </select>
    </div>
  </div>
</div>

<!-- ══ MAIN ═══════════════════════════════════════════════════════════════════ -->
<main class="main">
  <div class="results-row">
    <span class="result-count" id="result-count"></span>
    <button type="button" class="export-btn" id="export-btn" title="Export filtered careers to CSV">Export CSV</button>
  </div>

  <!-- Career grid -->
  <div class="career-grid" id="career-grid"></div>

  <!-- Empty state -->
  <div class="empty" id="empty-state">
    <div class="empty-icon">🔍</div>
    <h3>No careers found</h3>
    <p>Try a different search term or remove some filters.</p>
    <button class="empty-clear" id="empty-clear">Clear all filters</button>
  </div>

  <!-- Load more (mobile) -->
  <div class="load-wrap" id="load-wrap" style="display:none;">
    <button class="load-btn" id="load-more">Load more careers</button>
  </div>

  <!-- Pagination (desktop / web) -->
  <div class="pagination-wrap" id="pagination-wrap" style="display:none;" aria-label="Career pages"></div>
</main>

<!-- ══ CAREER MODAL ════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div id="modal-content"></div>
  </div>
</div>

<!-- ══ DATA SCRIPTS ════════════════════════════════════════════════════════════ -->
<script src="data/careers-data.js"></script>
<script src="data/exams-data.js"></script>
<script src="data/clusters-data.js"></script>
<script src="data/meta-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
