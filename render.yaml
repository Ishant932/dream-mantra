# Render Blueprint — full Dream Mantra (frontend + API on one URL)
# Dashboard → Blueprints → New Blueprint Instance → connect DreamsMantra/dream-mantra

services:
  - type: web
    name: dream-mantra
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: node backend/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@dreamsmantra.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: 9680102276
      - key: ADMIN2_EMAIL
        value: admin2@dreamsmantra.com
      - key: ADMIN2_PHONE
        value: 9999999998
      - key: ADMIN2_NAME
        value: Dream Mantra Admin 2
      - key: ADMIN2_PASSWORD
        sync: false
      - key: ADMIN_RESET_2FA
        sync: false
      - key: ADMIN_REQUIRE_2FA
        value: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional: set to false to disable Razorpay even when keys exist
      - key: PAYMENT_GATEWAY_ENABLED
        sync: false
      - key: SEED_SAMPLE_SLOTS
        value: true
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: WHATSAPP_ENABLED
        value: false
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_SANDBOX
        value: true
      - key: TWILIO_WHATSAPP_SANDBOX_CODE
        sync: false
      - key: WHATSAPP_SITE_URL
        value: https://dreammantra.in
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false

  # Pings both URLs every 5 min to reduce Render free-tier cold starts
  - type: cron
    name: dream-mantra-keepalive
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: echo "keepalive"
    startCommand: node -e "const urls=['https://dreammantra.in/api/warmup','https://dream-mantra.onrender.com/api/warmup'];Promise.allSettled(urls.map(u=>fetch(u,{headers:{'Cache-Control':'no-store'}}).then(r=>console.log(u,r.status))))"
    plan: free
    region: singapore

  # Hourly WhatsApp reminders + outbox processing
  - type: cron
    name: dream-mantra-whatsapp
    runtime: node
    schedule: "0 * * * *"
    buildCommand: echo "whatsapp-cron"
    startCommand: node -e "const s=process.env.CRON_SECRET;if(!s){console.error('CRON_SECRET missing');process.exit(1)}fetch('https://dreammantra.in/api/cron/whatsapp',{method:'POST',headers:{Authorization:'Bearer '+s}}).then(r=>r.text()).then(console.log).catch(e=>{console.error(e);process.exit(1)})"
    plan: free
    region: singapore
    envVars:
      - key: CRON_SECRET
        sync: false
