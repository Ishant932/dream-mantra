# Render Blueprint — full Dream Mantra (frontend + API on one URL)
# Dashboard → Blueprints → New Blueprint Instance → connect DreamsMantra/dream-mantra

services:
  - type: web
    name: dream-mantra
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm install --prefix backend && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: node backend/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@dreamsmantra.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: 9680102276
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMENT_GATEWAY_ENABLED
        value: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SEED_SAMPLE_SLOTS
        value: true
      - key: MONGODB_URI
        sync: false

  # Pings both URLs every 5 min to reduce Render free-tier cold starts
  - type: cron
    name: dream-mantra-keepalive
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: echo "keepalive"
    startCommand: node -e "const urls=['https://dreammantra.in/api/warmup','https://dream-mantra.onrender.com/api/warmup'];Promise.allSettled(urls.map(u=>fetch(u,{headers:{'Cache-Control':'no-store'}}).then(r=>console.log(u,r.status))))"
    plan: free
    region: singapore
