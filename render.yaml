# Render Blueprint — full Dream Mantra (frontend + API on one URL)
# Dashboard → Blueprints → New Blueprint Instance → connect DreamsMantra/dream-mantra

services:
  - type: web
    name: dream-mantra
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm install --prefix backend && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: node backend/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@dreamsmantra.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: 9680102276
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMENT_GATEWAY_ENABLED
        value: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SEED_SAMPLE_SLOTS
        value: true

  # Pings the web service every 14 min to reduce Render free-tier cold starts
  - type: cron
    name: dream-mantra-keepalive
    runtime: node
    schedule: "*/14 * * * *"
    buildCommand: echo "keepalive"
    startCommand: node -e "fetch('https://dream-mantra.onrender.com/api/warmup').catch(()=>fetch('https://dream-mantra.onrender.com/api/health'))"
    plan: free
    region: singapore
